version: '3.8'

services:
  # 1. FastAPI REST API Engine
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: knot_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://knot_user:knot_pass@db:5432/knot_production
      - REDIS_URL=redis://cache:6379/0
      - VAULT_SECRET_SALT=knot_production_salt_v2
    depends_on:
      - db
      - cache
    restart: always

  # 2. PostgreSQL with pgvector extension (High-speed nearest-neighbor value matching)
  db:
    image: pgvector/pgvector:pg16
    container_name: knot_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=knot_production
      - POSTGRES_USER=knot_user
      - POSTGRES_PASSWORD=knot_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # 3. Redis Ephemeris Cache (Sub-millisecond planetary query cache)
  cache:
    image: redis:7-alpine
    container_name: knot_cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

volumes:
  pgdata:
  redisdata:
